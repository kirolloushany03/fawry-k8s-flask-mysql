
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: fawry-task
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask-app
        image: kirollous03/flask-app:v1

        ports:
        - containerPort: 5002
        
        envFrom:
        - configMapRef:
            name: flask-config
        env:
        - name: MYSQL_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_PASSWORD

        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"

        startupProbe:
          httpGet:
            path: /
            port: 5002
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 10

        livenessProbe:
          httpGet:
            path: /
            port: 5002
          periodSeconds: 10
          timeoutSeconds: 2
          
        readinessProbe:
          httpGet:
            path: /
            port: 5002
          periodSeconds: 5
          timeoutSeconds: 2